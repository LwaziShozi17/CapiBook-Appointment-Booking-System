spring:
  datasource:
    url: jdbc:h2:mem:capibook_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=USER
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      auto-startup: false

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: test-secret-key-that-is-at-least-32-characters-long-for-HS256
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 604800000
  cors:
    allowed-origins: http://localhost:5173

logging:
  level:
    com.capitec.capibook: INFO
